# 매수 기준 대시보드 설정 — 숫자만 바꿔서 자기 기준으로 쓰면 됩니다.
server:
  host: 127.0.0.1
  port: 8000
  open_browser: true

cache_ttl_seconds: 600

# 화면을 띄워 두면 이 간격(분)마다 자동 새로고침합니다. 0이면 끕니다.
auto_refresh_minutes: 10

indicators:
  fear_greed:     { enabled: true, strong_below: 20, signal_below: 25 }
  vix:            { enabled: true, strong_at_or_above: 30, signal_at_or_above: 25 }
  # S&P 500 MDD(참고, 점수 제외): 사상 최고가 대비
  market_mdd:
    { enabled: true, index: "^GSPC", signal_at_or_below: -0.14, strong_at_or_below: -0.30, extreme_at_or_below: -0.47 }
  # QQQ MDD(참고, 점수 제외): 사상 최고가 대비. 첫 신호 = QQQ 실제 연평균 최대 하락률(끝난 해가
  # min_years 미만이면 anchor -20%). 이후 단계는 S&P 기준 단계(-14/-30/-47)의 '남은 가격' 비율을 첫 신호에 맞춰 옮김
  qqq_mdd:
    enabled: true
    index: "QQQ"
    anchor: -0.20
    min_years: 3
    min_days_per_year: 200
    signal_at_or_below: -0.14
    strong_at_or_below: -0.30
    extreme_at_or_below: -0.47
  rsi:            { enabled: true, period: 14, daily_at_or_below: 30, weekly_at_or_below: 35 }
  # 종목 MDD: 올해 고점 대비. 매수 시작 = 종목 연평균 최대 하락률,
  # 비중 확대·극단적 하락은 아래 숫자의 '남은 가격' 비율(86%→70%→53%)을 그대로 적용해 함께 이동
  # (끝난 해가 min_years 미만이면 아래 숫자 그대로)
  mdd:
    enabled: true
    signal_at_or_below: -0.14
    strong_at_or_below: -0.30
    extreme_at_or_below: -0.47
    min_years: 3
    min_days_per_year: 200
  moving_average: { enabled: true, daily_window: 200, weekly_window: 200 }
  # 단기 과열(참고, 점수 제외): 아래 4가지 중 caution 개수 이상 '과열 주의', overheat 개수 이상 '과열'
  overheat:
    enabled: true
    ma_window: 200
    ma_gap_at_or_above: 0.50     # 200일선보다 +50% 이상 위
    rsi_period: 14
    rsi_at_or_above: 80          # 일봉 RSI 80 이상
    surge_days: 15               # 최근 15거래일(3주) 동안
    surge_at_or_above: 0.25      #   +25% 이상 상승
    near_high_within: -0.03      # 52주 최고가 대비 -3% 이내
    caution_at_or_above: 2
    overheat_at_or_above: 3
